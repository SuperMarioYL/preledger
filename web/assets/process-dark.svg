<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Preledger 核心流程：agent 捕获、台账共享、评审者证伪、红测试转绿" data-palette="56c9e6-6a8be7-acf6ea-e0897b892ae8">
  <defs>
    <style>
    text { font-family: -apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; }
    .mono { font-family: ui-monospace,'SF Mono',Menlo,Consolas,'Cascadia Mono',monospace; }
    @media (prefers-reduced-motion: no-preference) {
      .flow { stroke-dasharray: 5 7; animation: plflow 1.4s linear infinite; }
      .flow.slow { animation-duration: 2.6s; }
      @keyframes plflow { to { stroke-dashoffset: -24; } }
      .breathe { animation: plbreathe 3.2s ease-in-out infinite; }
      .breathe.d1 { animation-delay: -1.1s; } .breathe.d2 { animation-delay: -2.2s; }
      @keyframes plbreathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      .drift { animation: pldrift 5s ease-in-out infinite; }
      .drift.d1 { animation-delay: -1.6s; } .drift.d2 { animation-delay: -3.3s; }
      @keyframes pldrift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      .orbit { animation: plorbit 46s linear infinite; transform-origin: 480.0 280.0; }
      .orbit.rev { animation-duration: 70s; animation-direction: reverse; }
      @keyframes plorbit { to { transform: rotate(360deg); } }
      .travel { animation: pltravel 3.4s linear infinite; }
      .travel.t2 { animation-delay: -1.1s; } .travel.t3 { animation-delay: -2.2s; } .travel.t4 { animation-delay: -0.6s; } .travel.t5 { animation-delay: -1.7s; }
      @keyframes pltravel {
        0% { offset-distance: 0%; opacity: 0; }
        8% { opacity: 1; } 92% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      .glowpulse { animation: plglow 4s ease-in-out infinite; }
      @keyframes plglow { 0%,100% { opacity: .5; } 50% { opacity: .95; } }
    }

    </style>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bgGlow" cx="62%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#56c9e6" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#6a8be7" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#050b12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#56c9e6"/>
      <stop offset="100%" stop-color="#6a8be7"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c151f"/>
      <stop offset="100%" stop-color="#050b12"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#173541" stroke-opacity="0.5" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="#050b12"/>
  <rect width="960" height="560" fill="url(#bgGlow)"/>
<text x="64" y="60" font-size="20" fill="#eefdfb" text-anchor="start" font-weight="700">Process — 捕获不打断编辑，评审先于合并</text>
<text x="64" y="84" font-size="13" fill="#95b3c4" text-anchor="start">agent 工作流零改动；评审者合并前过一遍台账</text>
<rect x="52" y="108" width="856" height="118" rx="14" fill="#050b12" stroke="#173541" stroke-width="1"/>
<text x="76" y="136" font-size="14.5" fill="#56c9e6" text-anchor="start" font-weight="600">Coding Agent — 工作流不变</text>
<rect x="96" y="152" width="216" height="56" rx="10" fill="#0c151f" stroke="#173541" stroke-width="1.4"/>
<text x="114" y="176" font-size="14.5" fill="#eefdfb" text-anchor="start" font-weight="600">① preledger install</text>
<text x="114" y="196" font-size="12" fill="#95b3c4" text-anchor="start">一次性接线 hook</text>
<path d="M312 180 H 360" fill="none" stroke="url(#edgeGrad)" stroke-width="1.6" class="flow"/>
<circle cx="204" cy="208" r="3.5" fill="#56c9e6" class="breathe"/>
<rect x="360" y="152" width="216" height="56" rx="10" fill="#0c151f" stroke="#173541" stroke-width="1.4"/>
<text x="378" y="176" font-size="14.5" fill="#eefdfb" text-anchor="start" font-weight="600">② 正常编辑 ×3</text>
<text x="378" y="196" font-size="12" fill="#95b3c4" text-anchor="start">PostToolUse 自动记录</text>
<path d="M576 180 H 664" fill="none" stroke="url(#edgeGrad)" stroke-width="1.6" class="flow"/>
<circle cx="468" cy="208" r="3.5" fill="#56c9e6" class="breathe"/>
<rect x="664" y="152" width="216" height="56" rx="10" fill="#050b12" stroke="#173541" stroke-width="1.4" stroke-dasharray="5 6"/>
<text x="682" y="176" font-size="14.5" fill="#95b3c4" text-anchor="start" font-weight="600">③ 继续编辑 …</text>
<text x="682" y="196" font-size="12" fill="#95b3c4" text-anchor="start">不受评审影响</text>
<circle cx="772" cy="208" r="3.5" fill="#56c9e6" class="breathe"/>
<rect x="52" y="330" width="856" height="150" rx="14" fill="#050b12" stroke="#173541" stroke-width="1"/>
<text x="76" y="358" font-size="14.5" fill="#6a8be7" text-anchor="start" font-weight="600">评审者 — 合并前过一遍台账</text>
<rect x="76" y="374" width="196" height="56" rx="10" fill="#0c151f" stroke="#173541" stroke-width="1.4"/>
<text x="92" y="398" font-size="14" fill="#eefdfb" text-anchor="start" font-weight="600">④ preledger up</text>
<text x="92" y="418" font-size="12" fill="#95b3c4" text-anchor="start">打开本地界面</text>
<path d="M272 402 H 292" fill="none" stroke="url(#edgeGrad)" stroke-width="1.6" class="flow"/>
<rect x="292" y="374" width="196" height="56" rx="10" fill="#0c151f" stroke="#173541" stroke-width="1.4"/>
<text x="308" y="398" font-size="14" fill="#eefdfb" text-anchor="start" font-weight="600">⑤ 逐条 确认 / 证伪</text>
<text x="308" y="418" font-size="12" fill="#95b3c4" text-anchor="start">带转录原话依据</text>
<path d="M488 402 H 508" fill="none" stroke="url(#edgeGrad)" stroke-width="1.6" class="flow"/>
<rect x="508" y="374" width="196" height="56" rx="10" fill="#0c151f" stroke="#173541" stroke-width="1.4"/>
<text x="524" y="398" font-size="14" fill="#eefdfb" text-anchor="start" font-weight="600">⑥ 证伪 → 失败测试</text>
<text x="524" y="418" font-size="12" fill="#95b3c4" text-anchor="start">套件变红</text>
<path d="M704 402 H 724" fill="none" stroke="url(#edgeGrad)" stroke-width="1.6" class="flow"/>
<rect x="724" y="374" width="196" height="56" rx="10" fill="#0c151f" stroke="#173541" stroke-width="1.4"/>
<text x="740" y="398" font-size="14" fill="#eefdfb" text-anchor="start" font-weight="600">⑦ 修复 → 转绿</text>
<text x="740" y="418" font-size="12" fill="#95b3c4" text-anchor="start">合并</text>
<circle cx="606" cy="430" r="6" fill="#f85149" class="breathe"/>
<circle cx="822" cy="430" r="6" fill="#3fb950" class="breathe"/>
<text x="606" y="452" font-size="11" fill="#f85149" text-anchor="middle">红</text>
<text x="822" y="452" font-size="11" fill="#3fb950" text-anchor="middle">绿</text>
<rect x="200" y="254" width="560" height="48" rx="10" fill="#0c151f" stroke="#56c9e6" stroke-width="1.6"/>
<text x="480" y="275" font-size="15" fill="#eefdfb" text-anchor="middle" font-weight="600" class="mono">.preledger/ledger.jsonl</text>
<text x="480" y="293" font-size="12" fill="#95b3c4" text-anchor="middle">随仓库走的假设台账 · 评审者的共同事实源</text>
<path id="dn360" d="M360 208 V 254" fill="none" stroke="none"/>
<circle cx="360" cy="212" r="4" fill="#acf6ea" class="travel travel"/>
<path d="M360 208 V 254" fill="none" stroke="#173541" stroke-width="1.6" class="flow"/>
<path id="dn672" d="M672 208 V 254" fill="none" stroke="none"/>
<circle cx="672" cy="212" r="4" fill="#acf6ea" class="travel travel t3"/>
<path d="M672 208 V 254" fill="none" stroke="#173541" stroke-width="1.6" class="flow"/>
<path id="up300" d="M300 330 V 302" fill="none" stroke="none"/>
<circle cx="300" cy="326" r="4" fill="#acf6ea" class="travel travel t2"/>
<path d="M300 330 V 302" fill="none" stroke="#173541" stroke-width="1.6" class="flow"/>
<path id="up560" d="M560 330 V 302" fill="none" stroke="none"/>
<circle cx="560" cy="326" r="4" fill="#acf6ea" class="travel travel t5"/>
<path d="M560 330 V 302" fill="none" stroke="#173541" stroke-width="1.6" class="flow"/>
<path d="M508 430 C 470 470 300 470 200 430" fill="none" stroke="#173541" stroke-width="1.6" class="flow"/>
<text x="330" y="500" font-size="12.5" fill="#95b3c4" text-anchor="start">失败测试指出该修哪里 —— agent 或人修复后转绿</text>
</svg>
