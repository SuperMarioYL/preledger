<g class="orbit"><circle cx="644.048773235279" cy="127.95122676472093" r="3.6" fill="#357c8e"/></g>
<g class="orbit rev"><circle cx="315.951226764721" cy="456.04877323527904" r="3.2" fill="#5670bb" opacity="0.9"/></g>
<text x="64" y="544" font-size="12.5" fill="#557588" text-anchor="start">台账是纯 JSONL：任何工具都能读；证伪编译落在仓库自己的测试体系里。</text>
